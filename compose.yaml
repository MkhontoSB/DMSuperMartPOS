services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set POSTGRES_DB in .env.compose}"
      POSTGRES_USER: "${POSTGRES_USER:?Set POSTGRES_USER in .env.compose}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.compose}"
    volumes:
      - supermart_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.compose}"
      APP_ENV: "${APP_ENV:-development}"
      SESSION_HOURS: "${SESSION_HOURS:-8}"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-5}"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.compose}"
      APP_ENV: "${APP_ENV:-development}"
      SESSION_HOURS: "${SESSION_HOURS:-8}"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      DB_POOL_SIZE: "${DB_POOL_SIZE:-5}"
      DB_MAX_OVERFLOW: "${DB_MAX_OVERFLOW:-5}"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  supermart_pgdata:
