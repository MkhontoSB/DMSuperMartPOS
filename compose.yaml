services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: supermart_dev
      POSTGRES_USER: supermart_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in local .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - supermart_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supermart_owner -d supermart_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
 
volumes:
  supermart_pgdata:
